[tool.poetry]
name = "online-store"
version = "0.1.0"
description = "Ядро интернет-магазина — классы Product и Category"
authors = ["Student"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.0"
mypy = "^1.9"
black = "^24.0"
isort = "^5.13"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/.pytest_cache_oop"

[tool.coverage.run]
data_file = "/tmp/.coverage_oop"
